include:
  - project: devsecops/gitlab-ci-common
    ref: master
    file: /template/artifactory_token_service.yml

before_script: []

variables:
  GRADLE_BUILD_LAUNCHER_TAG: "2.6.2"
  KUBERNETES_MEMORY_LIMIT: "8Gi"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

stages:
  - test
  - release

python_contracts:
  stage: test
  image: python:3.12-bookworm
  script:
    - python3 -B -m unittest discover -s ci -p 'test_*.py'
  interruptible: true

.android_job:
  stage: test
  image:
    name: ${TAK_REGISTRY_HOST}/devsecops/gradle-build-launcher:17-${GRADLE_BUILD_LAUNCHER_TAG}
    entrypoint: [""]
  extends: .artifactory_service_create_token_no_depends_bash
  before_script:
    - !reference [.artifactory_service_create_token_no_depends_bash, before_script]
    - export ARTIFACTORY_USER="$GITLAB_USER_EMAIL" ARTIFACTORY_PASSWORD="$CI_JOB_ARTIFACTORY_TOKEN"
    - sh ci/prepare_sdk.sh

validate:
  extends: .android_job
  interruptible: true
  script:
    - chmod +x gradlew
    - ./gradlew --no-daemon :core:test :app:testDebugUnitTest :app:lintDebug :app:packageDebugArtifact :app:assembleRelease
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - app/build/reports/lint-results-debug.*
    reports:
      junit:
        - core/build/test-results/test/*.xml
        - app/build/test-results/testDebugUnitTest/*.xml

main_release:
  extends: .android_job
  stage: release
  before_script:
    - !reference [.android_job, before_script]
    - export WEARTAK_RELEASE_KEYSTORE_FILE="$CI_PROJECT_DIR/app/weartak.keystore"
    - sh ci/prepare_signing.sh
  script:
    - ./gradlew --no-daemon :app:assembleRelease
    - sh ci/package_release.sh
  after_script:
    - rm -f -- "$CI_PROJECT_DIR/app/weartak.keystore"
  artifacts:
    when: on_success
    expire_in: 30 days
    paths:
      - app/build/outputs/lattice/release/
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE == "push"'
